name: Build Multi-Platform Executables

on:
  push:
    tags:
      - 'v*'  # 只在建立 v1.0.0, v1.2.3 等版本標籤時觸發
  workflow_dispatch:  # 保留手動觸發選項

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: win
            output_format: zip
            path_to_zip: dist/yt_abstract
          - os: macos-latest
            platform_name: mac
            output_format: zip
            path_to_zip: dist/yt_abstract.app
          - os: ubuntu-latest
            platform_name: linux
            output_format: tar
            path_to_zip: dist/yt_abstract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Install FFmpeg (System Level)
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          # We use choco to get ffmpeg, but our script looks for it in backend/bin
          # So we download it manually or use install_ffmpeg.py if it works?
          # Actually, build_exe.py expects backend/bin/ffmpeg.exe
          # Let's run our install script!
          python scripts/install_ffmpeg.py

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 3. Install Node & Build Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 4. Install Python Backend Dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          # Pre-cache heavy modules (torch) if possible, but standard pip is fine for now

      # 5. Build Executable (Unified Script)
      - name: Run Build Script
        run: python build_exe.py

      # 6. Package Artifacts
      # Windows -> Zip
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/yt_abstract -DestinationPath yt_abstract_win.zip

      # Mac -> Zip (Preserve Permissions)
      - name: Package macOS
        if: runner.os == 'macOS'
        # Force code signing (Ad-Hoc) to ensure structure is valid
        run: |
          codesign --force --deep -s - dist/yt_abstract.app
          # Create zip
          cd dist
          zip -r ../yt_abstract_mac.zip yt_abstract.app

      # Linux -> Tar.gz
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ../yt_abstract_linux.tar.gz yt_abstract

      # 7. Upload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt_abstract_${{ matrix.platform_name }}
          path: |
            *.zip
            *.tar.gz

  # 自動發布到 Release (只在 Tag 觸發時執行)
  release:
    name: Publish to Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/yt_abstract_win/*.zip
            artifacts/yt_abstract_mac/*.zip
            artifacts/yt_abstract_linux/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
