name: Build Multi-Platform Executables

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: yt_abstract.exe
            asset_name: yt_abstract-windows.exe
          - os: macos-latest
            artifact_name: yt_abstract
            asset_name: yt_abstract-macos
          - os: ubuntu-latest
            artifact_name: yt_abstract
            asset_name: yt_abstract-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller backend/main.py --name=yt_abstract --onefile --noconfirm `
            --add-data "backend/static;static" `
            --hidden-import=uvicorn `
            --hidden-import=fastapi `
            --hidden-import=faster_whisper `
            --hidden-import=yt_dlp
        shell: pwsh

      - name: Build executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller backend/main.py --name=yt_abstract --onefile --noconfirm \
            --add-data "backend/static:static" \
            --hidden-import=uvicorn \
            --hidden-import=fastapi \
            --hidden-import=faster_whisper \
            --hidden-import=yt_dlp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
